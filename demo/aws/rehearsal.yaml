AWSTemplateFormatVersion: '2010-09-09'
Description: BLACK FRIDAY AWS game (real PHP launch and growth migrations, then modelled rounds). One template for every deployment.
Parameters:
  Prefix: {Type: String, Default: black-friday-round}
  PresenterParameter: {Type: String, Default: /black-friday/round/presenter-key}
  PassphraseParameter: {Type: String, Default: /black-friday/round/presenter-passphrase}
  ArtifactBucket: {Type: String}
  ImageKey: {Type: String}
  BaseImageVersion: {Type: String}
  WorkerKey: {Type: String}
  WorkflowKey: {Type: String}
  # The Web Function itself is created by operate.py through the Lambda Web API:
  # since Nov 2026 CreateWebFunction needs its revision and endpoint in the same
  # call, which AWS::Lambda::WebFunction does not send.
  ReleaseId: {Type: String, AllowedPattern: '[0-9a-f]{64}'}
Resources:
  Runs:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}]
      Tags: [{Key: project, Value: black-friday-demo}]
  ImageLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda-microvms/${Prefix}-shop'
      RetentionInDays: 7
  ImageBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: [sts:AssumeRole, sts:TagSession]
      Policies:
        - PolicyName: BuildOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/packages/image/*'
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ImageLogs.Arn
  ShopImage:
    Type: AWS::Lambda::MicrovmImage
    Properties:
      Name: !Sub '${Prefix}-shop'
      BaseImageArn: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:aws:microvm-image:al2023-1'
      BaseImageVersion: !Ref BaseImageVersion
      Description: Trusted PHP and PostgreSQL rehearsal runtime
      AdditionalOsCapabilities: []
      CpuConfigurations: [{Architecture: ARM_64}]
      EnvironmentVariables: []
      EgressNetworkConnectors:
        - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:aws:network-connector:aws-network-connector:INTERNET_EGRESS'
      BuildRoleArn: !GetAtt ImageBuildRole.Arn
      CodeArtifact: {Uri: !Sub 's3://${ArtifactBucket}/${ImageKey}'}
      Resources: [{MinimumMemoryInMiB: 1024}]
      Hooks:
        Port: 8080
        MicrovmImageHooks: {Ready: ENABLED, ReadyTimeoutInSeconds: 30}
      Logging:
        CloudWatch: {LogGroup: !Ref ImageLogs}
      Tags: [{Key: project, Value: black-friday-demo}]
  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub '/aws/lambda/${Prefix}-evaluator', RetentionInDays: 7}
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EvaluateTrustedShop
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [lambda:RunMicrovm, lambda:GetMicrovm, lambda:TerminateMicrovm, lambda:CreateMicrovmAuthToken]
                Resource: [!Ref ShopImage, !Sub '${ShopImage.ImageArn}:*']
              - Effect: Allow
                Action: lambda:PassNetworkConnector
                Resource: '*'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/runs/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt WorkerLogs.Arn
  Evaluator:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Prefix}-evaluator'
      Architectures: [arm64]
      Runtime: python3.13
      Handler: evaluator.handler
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref WorkerKey}
      Role: !GetAtt WorkerRole.Arn
      LoggingConfig: {LogGroup: !Ref WorkerLogs}
      Environment:
        Variables:
          ARTIFACT_BUCKET: !Ref ArtifactBucket
          IMAGE_ARN: !Ref ShopImage
          IMAGE_VERSION: !GetAtt ShopImage.LatestActiveImageVersion
          RELEASE_ID: !Ref ReleaseId
      MemorySize: 512
      Timeout: 300
      ReservedConcurrentExecutions: 10
      Tags: [{Key: project, Value: black-friday-demo}]
  EvaluatorVersion:
    Type: AWS::Lambda::Version
    UpdateReplacePolicy: Retain
    Properties: {FunctionName: !Ref Evaluator, Description: !Ref ReleaseId}
  WorkflowLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub '/aws/lambda/${Prefix}-workflow', RetentionInDays: 7}
  WorkflowRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RehearsalWorkflow
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [lambda:CheckpointDurableExecution, lambda:GetDurableExecutionState]
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${Prefix}-workflow:*'
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub '${Evaluator.Arn}:*'
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt Runs.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt WorkflowLogs.Arn
  Workflow:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Prefix}-workflow'
      Architectures: [arm64]
      Runtime: python3.13
      Handler: workflow.handler
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref WorkflowKey}
      Role: !GetAtt WorkflowRole.Arn
      LoggingConfig: {LogGroup: !Ref WorkflowLogs}
      Timeout: 90
      MemorySize: 512
      # The four-round game waits on one callback per round (four waits after the real Launch and growth steps);
      # 48 hours covers the whole event. Each round's results are separate items (pk = results#<run>#<round>) in the
      # Runs table: the workflow writes them with UpdateItem and the Web Function reads them with GetItem.
      DurableConfig: {ExecutionTimeout: 172800, RetentionPeriodInDays: 7}
      Environment:
        Variables:
          RUN_TABLE: !Ref Runs
          EVALUATOR_ARN: !Ref EvaluatorVersion
      Tags: [{Key: project, Value: black-friday-demo}]
  WorkflowVersion:
    Type: AWS::Lambda::Version
    UpdateReplacePolicy: Retain
    Properties: {FunctionName: !Ref Workflow, Description: !Ref ReleaseId}
  WebRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: StageControls
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:PutItem]
                Resource: !GetAtt Runs.Arn
              - Effect: Allow
                Action: lambda:InvokeFunction
                # Every published version, not only the current one: after a deploy, warm Web Function
                # environments of the previous revision keep serving for a while and invoke their own version.
                Resource: !Sub '${Workflow.Arn}:*'
              - Effect: Allow
                Action: lambda:ListDurableExecutionsByFunction
                Resource: [!GetAtt Workflow.Arn, !Sub '${Workflow.Arn}:*']
              - Effect: Allow
                Action: [lambda:GetDurableExecution, lambda:SendDurableExecutionCallbackSuccess]
                Resource: !Sub '${Workflow.Arn}:*/durable-execution/*'
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PresenterParameter}'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PassphraseParameter}'
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
                    kms:EncryptionContext:PARAMETER_ARN:
                      - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PresenterParameter}'
                      - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PassphraseParameter}'
Outputs:
  WebRole: {Value: !GetAtt WebRole.Arn}
  RunTable: {Value: !Ref Runs}
  EvaluatorVersion: {Value: !Ref EvaluatorVersion}
  WorkflowVersion: {Value: !Ref WorkflowVersion}
  ImageArn: {Value: !Ref ShopImage}
  ImageVersion: {Value: !GetAtt ShopImage.LatestActiveImageVersion}
  ArtifactBucket: {Value: !Ref ArtifactBucket}
  WorkerKey: {Value: !Ref WorkerKey}
  WorkerRole: {Value: !GetAtt WorkerRole.Arn}

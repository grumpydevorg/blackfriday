name: black-friday-simulator
services:
  simulator:
    build: .
    init: true
    command: [python, -u, simulator.py]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BLACK_FRIDAY_SIM_API_PORT:-8780}:8780"
      - "127.0.0.1:${BLACK_FRIDAY_SIM_SHOP_PORT:-8781}:8781"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8780/ready', timeout=2)"]
      interval: 1s
      timeout: 3s
      retries: 20
  postgres:
    extends:
      file: compose.yaml
      service: postgres
    volumes: !reset []
    tmpfs: [/var/lib/postgresql]

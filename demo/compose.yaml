services:
  arena:
    build: .
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BLACK_FRIDAY_PORT:-8766}:8766"
    volumes:
      - arena-state:/state
      - ../assets/cloud-surge.png:/art/cloud-surge.png:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/api/state', timeout=2)"]
      interval: 1s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: demo
      # Disposable local database; port 5432 is not published to the host.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-state:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, demo, -d, shop]
      interval: 1s
      timeout: 3s
      retries: 20
volumes:
  arena-state:
  postgres-state:
